apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskqueue-metrics-exporter
spec:
  # One replica is enough — every scrape reads the same database state,
  # and Prometheus would just scrape duplicate gauges from extra pods.
  replicas: 1
  selector:
    matchLabels:
      app: taskqueue-metrics-exporter
  template:
    metadata:
      labels:
        app: taskqueue-metrics-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: exporter
          image: taskqueue:latest
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: ROLE
              value: exporter
            - name: METRICS_PORT
              value: "9090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
